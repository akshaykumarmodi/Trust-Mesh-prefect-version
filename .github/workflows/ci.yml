name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET: ci_test_jwt_secret_token_2026
          ADMIN_SECRET_KEY: ci_test_admin_secret_key_2026
          ADMIN_NOTIFICATION_EMAIL: akshay123modi@gmail.com
          EMAIL_FROM: TrustMesh Alerts <onboarding@resend.dev>
          RESEND_API_KEY: ""
        run: |
          pytest backend/tests/ -v

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Run frontend lint
        run: |
          npm --prefix frontend run lint

      - name: Run frontend production build
        run: |
          npm --prefix frontend run build
