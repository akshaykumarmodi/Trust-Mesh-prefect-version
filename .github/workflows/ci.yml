name: CI

on:
  push:
    branches:
      - main
      - feat/trustmesh-core-platform
      - feat/trustmesh-ai
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: "backend"
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET: "ci_test_jwt_secret_token_2026"
          ADMIN_SECRET_KEY: "ci_test_admin_secret_key_2026"
          ADMIN_NOTIFICATION_EMAIL: "ci-admin@example.com"
          EMAIL_FROM: "TrustMesh Alerts <onboarding@resend.dev>"
          RESEND_API_KEY: ""
          AI_ENABLED: "true"
          AI_PROVIDER: "groq"
          AI_MODEL_NAME: "openai/gpt-oss-120b"
          GROQ_API_KEY: ""
        run: |
          pytest backend/tests/ -v

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend ci

      - name: Run frontend lint
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend run lint

      - name: Run frontend production build
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend run build
